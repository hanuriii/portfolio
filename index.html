<style>
/* ══════════════════════════════════════════════════════════════
   🎨 디자인 토큰 — 색과 폰트는 여기서만 바꾸면 전체에 반영됩니다
   (색상은 김하늘 포트폴리오 PDF에서 그대로 추출했습니다)
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 어두운 화면 */
  --ink:        #121212;   /* 기본 다크 배경 */
  --ink-2:      #1b1b1b;   /* 다크 카드 배경 */
  --ink-3:      #252525;   /* 다크 카드 hover */
  --on-ink:     #f2efec;   /* 다크 위 글자 */
  --on-ink-soft:#e3dfda;   /* 다크 위 글자 — 흰색이지만 제목보다 한 톤 낮게 */
  --on-ink-dim: #8f8a86;   /* 다크 위 보조 글자 */
  --line-ink:   rgba(242,239,236,.13);

  /* 밝은 화면 */
  --paper:      #f4f2ef;   /* 기본 라이트 배경 */
  --paper-alt:  #ebe8e4;   /* 섹션 구분용 보조 배경 */
  --paper-2:    #ffffff;   /* 라이트 카드 배경 */
  --on-paper:   #1a1a1a;   /* 라이트 위 글자 */
  --on-paper-dim:#6f6a66;  /* 라이트 위 보조 글자 */
  --line-paper: rgba(26,26,26,.12);

  /* 포인트 컬러 */
  --rose:       #c9605f;   /* 메인 포인트 (더스티 로즈) */
  --rose-soft:  #dc8e8d;
  --rose-pale:  #f6dcd8;
  --slate:      #676c83;   /* 서브 포인트 (슬레이트 블루) */
  --slate-soft: #9aa1b6;

  /* 폰트 */
  --en: "Poppins", "Pretendard Variable", sans-serif;   /* 영문 제목 */
  --kr: "Pretendard Variable", "Apple SD Gothic Neo", sans-serif; /* 본문 */

  --nav-h: 68px;
  --r: 16px;              /* 모서리 둥글기 */
  --ease: cubic-bezier(.22,.68,.28,1);
}

/* ══════════════════ 기본 세팅 ══════════════════ */
*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }
body{
  margin:0; background:var(--ink); color:var(--on-ink);
  font-family:var(--kr); font-weight:400; line-height:1.65;
  letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{ display:block; max-width:100%; height:auto; }
a{ color:inherit; text-decoration:none; }
ul,ol{ margin:0; padding:0; list-style:none; }
h1,h2,h3,h4,p{ margin:0; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
::selection{ background:var(--rose); color:#fff; }

:focus-visible{ outline:2px solid var(--rose); outline-offset:3px; border-radius:4px; }

/* ══════════════════ 커스텀 커서 ══════════════════
   반투명 원이 커서를 대신하고, 그 뒤로 은은한 빛무리가 따라옵니다.
   position:fixed 라서 어느 섹션으로 스크롤해도 계속 보입니다.
   마우스가 있는 기기에서만 켜집니다.
   ══════════════════════════════════════════════ */
.cur{
  position:fixed; left:0; top:0; z-index:10020; pointer-events:none;
  opacity:0; transition:opacity .3s; will-change:transform;
}
/* 링·점·광선 모두 커서를 중심으로 겹쳐 놓고 scale 로만 변형합니다
   (크기를 직접 바꾸면 중심이 흔들려서 커서와 어긋나 보입니다) */
.cur > *{
  position:absolute; left:0; top:0; border-radius:50%;
  transform:translate(-50%,-50%) scale(1);
  transition:transform .3s var(--ease), opacity .3s, border-color .3s;
}
/* ① 기본 — 속을 아주 옅게 채운 얇은 링 */
.cur-ring { width:26px; height:26px; border:1.3px solid rgba(242,239,236,.72);
            background:rgba(242,239,236,.07); backdrop-filter:blur(1px);
            transition:transform .3s var(--ease), opacity .3s, border-color .3s, background .3s; }
.cur-ring2{ width:46px; height:46px; border:1px solid rgba(224,161,158,.55);
            opacity:0; transform:translate(-50%,-50%) scale(.6); }

body.cur-on .cur{ opacity:1; }

/* ② 호버 — 링이 커지고 바깥에 두 번째 링이 겹칩니다 (동심원) */
body.cur-tap .cur-ring { transform:translate(-50%,-50%) scale(1.55); border-color:rgba(224,161,158,.9); }
body.cur-tap .cur-ring2{ opacity:1; transform:translate(-50%,-50%) scale(1); }

/* ③ 누를 때 — 링이 오므라들고 사방으로 빛살이 퍼집니다 */
body.cur-down .cur-ring { transform:translate(-50%,-50%) scale(.6); transition-duration:.12s; }
body.cur-down .cur-ring2{ opacity:.35; transform:translate(-50%,-50%) scale(.8); transition-duration:.12s; }
.cur-rays{
  width:58px; height:58px; border-radius:0; opacity:0;
  background:repeating-conic-gradient(from 0deg,
    rgba(224,161,158,.95) 0deg 2.4deg, transparent 2.4deg 30deg);
  -webkit-mask:radial-gradient(circle, transparent 0 38%, #000 41% 100%);
          mask:radial-gradient(circle, transparent 0 38%, #000 41% 100%);
}
body.cur-burst .cur-rays{ animation:curRays .5s ease-out; }
@keyframes curRays{
  0%  { opacity:.95; transform:translate(-50%,-50%) scale(.42); }
  100%{ opacity:0;   transform:translate(-50%,-50%) scale(1.65); }
}

/* 밝은 섹션에서는 링을 어둡게 */
body.cur-paper .cur-ring { border-color:rgba(26,26,26,.55); background:rgba(26,26,26,.05); }
body.cur-paper .cur-ring2{ border-color:rgba(201,96,95,.6); }

body.cur-enabled.cur-on,
body.cur-enabled.cur-on a,
body.cur-enabled.cur-on button{ cursor:none; }
@media (prefers-reduced-motion:reduce){
  .cur > *{ transition:none; }
  .cur-rays{ display:none; }
}

.skip{
  position:absolute; left:16px; top:-60px; z-index:200;
  background:var(--rose); color:#fff; padding:10px 18px; border-radius:8px;
  transition:top .2s;
}
.skip:focus{ top:16px; }

/* 레이아웃 컨테이너 */
.wrap{ width:100%; max-width:1200px; margin-inline:auto; padding-inline:32px; }

/* 섹션 배경 테마 */
.band{ position:relative; }
.band--ink  { background:var(--ink);  color:var(--on-ink); }
.band--paper{ background:var(--paper);color:var(--on-paper); }
.band--paper-alt{ background:var(--paper-alt); color:var(--on-paper); }
.band--paper-alt .dim{ color:var(--on-paper-dim); }
.band--paper .dim{ color:var(--on-paper-dim); }
.dim{ color:var(--on-ink-dim); }

/* ── 모바일 줄바꿈 제어 ─────────────────────────────────────
   .br-m : PC에서는 무시되고 모바일에서만 줄바꿈이 들어갑니다.
           글 안에 <span class="br-m"></span> 를 넣어 쓰세요.
   ─────────────────────────────────────────────────────────── */
.br-m{ display:none; }
@media (max-width:860px){
  .br-m{ display:inline; }
  .br-m::before{ content:"\A"; white-space:pre; }
}

section{ padding-block:112px; scroll-margin-top:var(--nav-h); }
section.tight{ padding-top:0; }

/* ══════════════════ 섹션 헤더 ══════════════════ */
.sec-head{
  display:grid;
  gap:24px;
  margin-bottom:64px;
}
.sec-title{
  font-family:var(--en); font-weight:600; font-size:clamp(34px,5.2vw,60px);
  line-height:1.04; letter-spacing:-.03em;
}
.sec-title .d{ color:var(--rose); }
.sec-desc{ margin-top:0; max-width:620px; font-size:16px; }

/* ══════════════════ 내비게이션 ══════════════════ */
.nav{
  position:fixed; inset:0 0 auto 0; z-index:100; height:var(--nav-h);
  background:rgba(18,18,18,.72); backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid transparent; transition:background .35s, border-color .35s, color .35s;
}
.nav.is-paper{ background:rgba(244,242,239,.78); color:var(--on-paper); }
.nav.is-stuck{ border-bottom-color:var(--line-ink); }
.nav.is-paper.is-stuck{ border-bottom-color:var(--line-paper); }
.nav-in{ display:flex; align-items:center; justify-content:space-between; height:100%; }
.brand{ display:flex; align-items:center; width:102px; height:28px; }
.brand-mark{ display:block; width:100%; height:auto; filter:invert(1); transition:filter .3s,opacity .25s; }
.nav.is-paper .brand-mark{ filter:none; }
.brand:hover .brand-mark{ opacity:.68; }
.nav-menu{ display:flex; align-items:center; gap:6px; }
.nav-menu a{
  position:relative; padding:9px 14px; border-radius:8px;
  font-family:var(--en); font-size:13px; font-weight:500; letter-spacing:.02em;
  opacity:.62; transition:opacity .2s, background .2s;
}
.nav-menu a:hover{ opacity:1; }
.nav-menu a[aria-current="true"]{ opacity:1; }
.nav-menu a[aria-current="true"]::after{
  content:""; position:absolute; left:14px; right:14px; bottom:3px;
  height:2px; border-radius:2px; background:var(--rose);
}
.burger{
  display:none; width:42px; height:42px; border:1px solid currentColor; border-radius:50%;
  align-items:center; justify-content:center; opacity:.7;
}
.burger span{ display:block; width:15px; height:9px; position:relative; }
.burger span::before,.burger span::after{
  content:""; position:absolute; left:0; right:0; height:1.5px; background:currentColor;
  transition:transform .3s var(--ease), top .3s var(--ease);
}
.burger span::before{ top:0; } .burger span::after{ top:7px; }
.nav.open .burger span::before{ top:4px; transform:rotate(45deg); }
.nav.open .burger span::after { top:4px; transform:rotate(-45deg); }

@media (max-width:860px){
  .burger{ display:flex; }
  .nav-menu{
    position:fixed; top:var(--nav-h); left:0; right:0; flex-direction:column; gap:0;
    background:var(--ink); border-bottom:1px solid var(--line-ink);
    max-height:0; overflow:hidden; transition:max-height .38s var(--ease);
  }
  .nav.is-paper .nav-menu{ background:var(--paper); border-bottom-color:var(--line-paper); }
  .nav.open .nav-menu{ max-height:60vh; }
  .nav-menu a{ width:100%; padding:17px 32px; border-radius:0; font-size:15px; opacity:.8; }
  .nav-menu a[aria-current="true"]::after{ left:32px; right:auto; width:14px; bottom:12px; }
}

/* ══════════════════ HERO ══════════════════ */
.hero{ padding-top:calc(var(--nav-h) + 70px); padding-bottom:100px; overflow:hidden; }
/* 입자 캔버스 — 콘텐츠보다 뒤, 배경보다 앞 */
.hero-fx{ position:absolute; inset:0; z-index:1; pointer-events:none; }
.hero > .wrap{ position:relative; z-index:2; }

/* 작은 대문자 정보 글씨 */
.meta{
  font-family:var(--en); font-size:10.5px; font-weight:500;
  letter-spacing:.2em; text-transform:uppercase; color:var(--on-ink-dim);
}
.meta--rose{ color:var(--rose); }

/* 헤어라인으로 나눈 정보 줄 — 좌·우 끝에 붙습니다 */
/* 가로 구분선 없이 좌·우 끝에만 정보를 붙입니다 */
.hero-rule{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:8px 0;
}
.hero-split{
  position:relative; z-index:5;
  font-size:13.5px; color:var(--on-ink-dim);
}
.hero-split b{ color:var(--on-ink); font-weight:500; }

.hero-content{
  position:relative; z-index:5; display:inline-block;
  width:fit-content; max-width:100%;
}

/* 이름이 화면 폭을 거의 채우는 무대 */
.hero-stage{ position:relative; padding:10px 0; }
/* 이름 — 가늘게 뽑고 뒷글자는 속을 비워 유리처럼 뒤가 비치게 합니다 */
.hero h1{
  display:block; margin:0; white-space:nowrap;
  font-family:var(--en); font-weight:300;
  font-size:clamp(50px,11.8vw,170px); line-height:.88; letter-spacing:-.035em;
}

.hero-content .hero-rule{
  display:flex; align-items:center; justify-content:space-between;
  width:calc(100% + 24px); margin-left:-10px; padding:8px 0;
}

#hero-t2, #hero-s2{ text-align:right; }
/* 속을 비우고 얇은 외곽선만 남긴 글자 */
.hero h1 .ch--out{
  color:transparent;
  -webkit-text-stroke:.011em rgba(242,239,236,.95);
  /* 밝은 구체 위에 올라가도 외곽선이 묻히지 않도록 아주 옅은 그림자 */
  filter:drop-shadow(0 0 7px rgba(0,0,0,.45));
}
.hero h1 .d{ color:var(--rose-soft); }

.hero-bottom{
  display:flex; align-items:flex-end; justify-content:space-between;
  gap:30px; padding-top:34px;
}
.hero-tag{ font-size:clamp(15px,1.6vw,18px); color:var(--on-ink-dim); line-height:1.75; }
.hero-tag b{ color:var(--on-ink); font-weight:500; }
.hero-cta{ display:flex; flex-wrap:wrap; gap:10px; margin-top:26px; }
.btn{
  display:inline-flex; align-items:center; gap:11px; min-height:50px;
  padding:0 12px 0 24px; border-radius:100px; font-size:15px; font-weight:500;
  border:1px solid var(--line-ink); transition:.28s var(--ease);
}
/* 원형 화살표 아이콘 */
.ar-c{
  display:grid; place-items:center; width:28px; height:28px; border-radius:50%;
  background:rgba(0,0,0,.2); font-size:12px; line-height:1;
  transition:transform .28s var(--ease);
}
.btn--ghost .ar-c{ background:rgba(242,239,236,.12); }
.btn:hover .ar-c{ transform:translate(2px,-2px); }
.btn .ar{ transition:transform .28s var(--ease); }
.btn:hover .ar{ transform:translateX(4px); }
.btn--fill{ background:var(--rose); border-color:var(--rose); color:#fff; }
.btn--fill:hover{ background:#b8514f; border-color:#b8514f; box-shadow:0 10px 30px -10px rgba(201,96,95,.75); }
.btn--ghost:hover{ border-color:var(--rose); color:var(--rose-soft); }
.band--paper .btn{ border-color:var(--line-paper); }
.band--paper .btn--ghost:hover{ border-color:var(--rose); color:var(--rose); }

/* ── 이름: 한 글자씩 등장 ─────────────────────────────── */
.hero h1 .ch{ display:inline-block; opacity:0; transform:translateY(.4em); }
body.ready .hero h1 .ch{ animation:chIn .75s var(--ease) forwards; }
body.ready .hero h1 .ch.d{ animation:dotIn .85s cubic-bezier(.34,1.5,.64,1) forwards; }
@keyframes chIn { to{ opacity:1; transform:none; } }
@keyframes dotIn{ 0%{ opacity:0; transform:translateY(.4em) scale(.2); } 100%{ opacity:1; transform:none; } }

/* ── 히어로 요소 순차 등장 ────────────────────────────── */
.h-rv{ opacity:0; transform:translateY(16px); transition:opacity .85s var(--ease), transform .85s var(--ease); }
body.ready .h-rv{ opacity:1; transform:none; }

/* ── 구체 클러스터 (표지 모티프) ──────────────────────────
   이름 뒤 레이어에 겹쳐 놓아 타이포가 화면 폭을 다 쓰게 합니다 */
.orbs{
  --lx:0%; --ly:0%;                  /* 커서를 따라가는 광원 위치 */
  position:absolute; z-index:1; right:-56px; top:50%;
  width:370px; height:352px; margin-top:-160px;   /* 정중앙보다 살짝 위로 */
}
/* 구체 뒤 은은한 빛 번짐 — 검은 배경에 붕 뜨지 않게 */
.orbs::before{
  content:""; position:absolute; left:4%; top:8%; width:92%; height:84%;
  background:
    radial-gradient(circle at 34% 44%, rgba(224,161,158,.30), transparent 62%),
    radial-gradient(circle at 76% 58%, rgba(118,124,147,.26), transparent 62%);
  filter:blur(40px); pointer-events:none;
}
/* 바깥 .orb = 커서 패럴랙스 담당 / 안쪽 i = 실제 원 + 떠다니는 움직임 */
.orb{ position:absolute; transition:transform .55s cubic-bezier(.2,.7,.3,1); will-change:transform; }
.orb > i{ display:block; width:100%; height:100%; border-radius:50%; opacity:0; transform:scale(.12); }

/* 유리 토러스(도넛)를 주인공으로, 작은 유리 구슬이 조연 */
.orb--torus{ width:318px; height:318px; right:0;   top:16px;  }
.orb--bead { width:96px;  height:96px;  left:16px; top:214px; }
.orb--ring { width:176px; height:176px; left:66px; top:56px;  }
.orb--mini { width:22px;  height:22px;  left:0;    top:96px;  }

/* ── 유리 토러스 ─────────────────────────────────────────
   conic-gradient 로 무지갯빛 띠를 만들고, radial mask 로
   가운데를 뚫어 도넛 형태를 만듭니다. 위쪽 두 개의 흰 반사가
   유리 하이라이트 역할을 합니다.
   ─────────────────────────────────────────────────────── */
.orb--torus > i{
  background:
    /* 유리 반사 — 작고 또렷하게 두 군데 */
    radial-gradient(closest-side at calc(30% + var(--lx)) calc(15% + var(--ly)), rgba(255,255,255,.92), transparent 17%),
    radial-gradient(closest-side at calc(78% + var(--lx)) calc(84% + var(--ly)), rgba(255,255,255,.5), transparent 14%),
    /* 무지갯빛 띠 — 밝은 색과 짙은 색을 번갈아 넣어 입체감을 만듭니다 */
    conic-gradient(from 202deg,
      #f6ded9   0deg, #e2a5a0  30deg, #b8646c  72deg, #8a5f86 112deg,
      #5f6ba8 152deg, #8f9ec4 196deg, #cfa9a6 238deg, #7d6f8e 286deg,
      #c98d84 322deg, #f6ded9 360deg);
  -webkit-mask:radial-gradient(circle at 50% 50%, transparent 0 36%, #000 37.5% 100%);
          mask:radial-gradient(circle at 50% 50%, transparent 0 36%, #000 37.5% 100%);
}
/* 토러스 뒤로 깔리는 빛 — mask 때문에 그림자를 못 써서 따로 둡니다 */
.orb--torus::before{
  content:""; position:absolute; inset:6%; border-radius:50%;
  background:radial-gradient(circle, rgba(201,96,95,.20), transparent 68%);
  filter:blur(30px); z-index:-1;
}
.orb--bead > i{
  background:radial-gradient(circle at calc(30% + var(--lx)) calc(24% + var(--ly)), #f8e4e0, #e0a19e 46%, #cb6667 100%);
  box-shadow:0 20px 44px -20px rgba(203,102,103,.85);
}
.orb--ring > i{ border:1px solid rgba(242,239,236,.22); }
.orb--mini > i{
  background:radial-gradient(circle at calc(32% + var(--lx)) calc(26% + var(--ly)), #cfd4e2, var(--slate) 72%);
  box-shadow:0 8px 18px -6px rgba(103,108,131,.85);
}

/* 등장(점 → 형태) 후 느리게 떠다니기 */
body.ready .orb--torus > i{ animation:orbIn 1.05s cubic-bezier(.22,.9,.3,1) .30s forwards, float1 13s ease-in-out 1.5s infinite; }
body.ready .orb--ring  > i{ animation:orbIn .95s cubic-bezier(.22,.9,.3,1) .46s forwards, float2 17s ease-in-out 1.6s infinite; }
body.ready .orb--bead  > i{ animation:orbIn .95s cubic-bezier(.22,.9,.3,1) .40s forwards, float2 11s ease-in-out 1.5s infinite; }
body.ready .orb--mini  > i{ animation:orbIn .95s cubic-bezier(.22,.9,.3,1) .58s forwards, float1 9s  ease-in-out 1.6s infinite; }
@keyframes orbIn{ to{ opacity:1; transform:none; } }
@keyframes float1{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-16px)} }
@keyframes float2{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(13px)} }

.scroll-cue{
  display:inline-flex; align-items:center; gap:13px; flex:0 0 auto;
  font-family:var(--en); font-size:11px; font-weight:500;
  letter-spacing:.18em; text-transform:uppercase; color:var(--on-ink-dim);
  transition:color .25s;
}
.scroll-cue:hover{ color:var(--on-ink); }
.scroll-line{ position:relative; display:block; width:1px; height:34px; background:var(--line-ink); overflow:hidden; }
.scroll-line i{
  position:absolute; left:0; top:0; width:1px; height:13px;
  background:var(--rose); animation:scrollDot 2.1s ease-in-out infinite;
}
@keyframes scrollDot{ 0%{ transform:translateY(-15px) } 100%{ transform:translateY(34px) } }

/* 태블릿 — 구체를 조금 줄여 이름과 덜 겹치게 */
@media (max-width:1100px){
  .orbs{ width:320px; height:320px; margin-top:-168px; right:-40px; }
  .orb--torus{ width:296px; height:296px; left:12px; top:0; }
  .orb--ring { width:186px; height:186px; left:112px; top:78px; }
  .orb--bead { width:88px;  height:88px;  left:0;    top:190px; }
  .orb--mini { width:20px;  height:20px;  right:18px; top:50px; }
}

@media (max-width:860px){
  .hero{ padding-top:calc(var(--nav-h) + 18px); padding-bottom:56px; }
  /* 모바일에서는 구체를 이름 위로 되돌려 겹치지 않게 합니다 */
  .hero-stage{ display:flex; flex-direction:column; gap:6px; padding:16px 0 20px; }
  .orbs{ position:relative; right:auto; top:auto; margin:0 auto; width:250px; height:250px; }
  .orb--torus{ width:230px; height:230px; left:10px; top:0; }
  .orb--ring { width:144px; height:144px; left:88px;  top:62px; }
  .orb--bead { width:68px;  height:68px;  left:0;     top:150px; }
  .orb--mini { width:16px;  height:16px;  right:14px; top:40px; }
  .hero h1{ font-size:clamp(44px,13.6vw,90px); }
  .hero-bottom{ flex-direction:column; align-items:flex-start; gap:22px; padding-top:26px; }
  .hero-cta{ width:100%; }
  .hero-cta .btn{ flex:1 1 auto; justify-content:center; padding:0 18px; }
  .hero-rule{ padding:11px 0; }
  /* 좁은 화면에선 세 항목이 줄바꿈되어 지저분해지므로 가운데 항목은 숨깁니다 */
  .hero-rule #hero-role{ display:none; }
  .hero-split{ font-size:12.5px; }
  .scroll-line{ height:26px; }
}

/* ══════════════════ ABOUT ══════════════════ */
.about-grid{ display:grid; grid-template-columns:240px minmax(0,1fr); gap:56px; align-items:start; }

/* ── 프로필 프레임 ───────────────────────────────────────────
   표지의 "겹친 원 + 그라데이션 구체" 모티프를 그대로 가져왔습니다.
   사진 뒤로 얇은 원이 어긋나게 겹치고, 오른쪽 아래에 로즈 구체가 걸칩니다.
   ─────────────────────────────────────────────────────────── */
.portrait-frame{ position:relative; flex:0 0 auto; width:180px; }

.portrait{
  position:relative; z-index:2;
  width:100%; aspect-ratio:1; height:auto; border-radius:50%; object-fit:cover;
  /* 배경색과 같은 링을 둘러 뒤 도형에서 사진이 오려낸 것처럼 보이게 합니다 */
  box-shadow:0 0 0 6px var(--paper), 0 12px 30px -14px rgba(90,60,60,.5);
}
/* 얇은 아웃라인 원 — 왼쪽 위로 어긋나게 */
.pf-ring{
  position:absolute; z-index:1; left:-22px; top:-16px;
  width:100%; aspect-ratio:1; border-radius:50%;
  border:1px solid rgba(26,26,26,.3);
}
/* 그라데이션 구체 — 오른쪽 아래에서 사진 뒤로 파고듦 */
.pf-orb{
  position:absolute; z-index:1; right:-26px; bottom:-2px;
  width:74px; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 32% 26%, #f8e4e0, var(--rose-soft) 46%, var(--rose) 100%);
  box-shadow:0 10px 26px -8px rgba(201,96,95,.55);
  animation:pfFloat 9s ease-in-out infinite;
}
/* 작은 슬레이트 구체 — 왼쪽 아래 균형추 */
.pf-dot{
  position:absolute; z-index:3; left:-2px; bottom:22px;
  width:20px; aspect-ratio:1; border-radius:50%;
  background:radial-gradient(circle at 32% 26%, var(--slate-soft), var(--slate));
  box-shadow:0 4px 10px -3px rgba(103,108,131,.7);
  animation:pfFloat 11s ease-in-out infinite reverse;
}
@keyframes pfFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }

/* 이름 — 한 줄에 나란히, 한글은 크고 진하게 / 영문은 작고 흐리게 */
.portrait-cap{
  display:flex; align-items:baseline; flex-wrap:wrap; gap:2px 8px;
  font-size:12.5px; line-height:1.4; letter-spacing:.12em;
}
.portrait-cap b{
  font-size:20px; font-weight:600; color:var(--on-paper);
  letter-spacing:-.02em;
}
.portrait-meta{ margin-top:26px; min-width:0; }
.portrait-edu{
  display:grid; gap:5px; margin-top:16px; padding-top:15px;
  border-top:1px solid rgba(103,108,131,.18);
}
.portrait-edu strong{ font-size:13.5px; font-weight:600; color:var(--on-paper); letter-spacing:-.015em; }
.portrait-edu span{ font-size:12.5px; line-height:1.55; color:var(--on-paper-dim); letter-spacing:-.01em; }
.about-h{
  font-size:clamp(22px,3.2vw,32px); font-weight:600; line-height:1.45;
  letter-spacing:-.03em; margin-bottom:24px;
}
.about-h mark{ background:linear-gradient(transparent 62%, rgba(201,96,95,.26) 0); color:inherit; }
.about-body p{ margin-bottom:16px; font-size:16.5px; line-height:1.85; color:var(--on-paper-dim); }
.about-body p b{ color:var(--on-paper); font-weight:500; }

/* ── 핵심 역량: 6개 추상 오브젝트 + 선택형 상세 패널 ── */
.strengths{ margin-top:64px; }
.strength-explorer{
  min-height:280px; padding-block:18px;
}
.strength-intro{
  display:grid; justify-items:end; gap:12px;
  margin-bottom:30px; padding-inline:4px; text-align:right;
}
.strength-heading{
  display:inline-block;
  font-family:"IvyPresto Display","IvyPrestoDisplay",Georgia,"Times New Roman",serif;
  font-size:clamp(34px,4vw,46px); font-weight:400; line-height:1.02;
  letter-spacing:.015em; color:transparent;
  -webkit-text-stroke:.8px rgba(103,108,131,.68);
  transform:scaleX(1.16); transform-origin:right center;
}
.strength-heading .fill{
  color:rgba(103,108,131,.88); -webkit-text-stroke:0;
}
.strength-objects{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; height:250px; min-height:250px; padding:28px 22px;
  border:1px solid rgba(143,158,196,.16); border-radius:24px;
  background:linear-gradient(145deg,rgba(255,255,255,.84),rgba(207,212,226,.22) 50%,rgba(255,255,255,.72));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.82),0 22px 54px -46px rgba(95,107,168,.24);
}
.strength-object{
  position:relative; display:grid; place-items:center;
  width:96px; height:150px; flex:1 1 96px;
  border-radius:52px; isolation:isolate;
  animation:strengthWave 3.4s ease-in-out infinite;
  animation-delay:calc(var(--i) * -.32s);
  transition:filter .5s var(--ease), opacity .5s, flex-basis .5s var(--ease), transform .5s var(--ease);
}
@keyframes strengthWave{ 0%,100%{ translate:0 0; } 50%{ translate:0 -12px; } }
.strength-objects.has-selection .strength-object{ animation-play-state:paused; filter:grayscale(1); opacity:.28; transform:scale(.88); }
.strength-objects.has-selection .strength-object[aria-selected="true"]{
  flex-basis:122px; filter:none; opacity:1; transform:scale(1.18); z-index:3;
}
.strength-object::after{
  content:attr(data-n); position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
  font-family:var(--en); font-size:10px; font-weight:600; letter-spacing:.12em;
  color:var(--on-paper-dim); opacity:.7;
}
.shape-core,.shape-core::before,.shape-core::after{
  position:absolute; display:block; content:"";
  transition:transform .55s var(--ease), filter .55s var(--ease), opacity .4s;
}
.shape-core{ width:72px; height:72px; }
.strength-object:hover .shape-core,
.strength-object[aria-selected="true"] .shape-core{ transform:scale(1.12) rotate(4deg); filter:drop-shadow(0 16px 14px rgba(61,43,60,.22)); }
.strength-object[aria-selected="true"]::after{ color:var(--rose); opacity:1; }

/* 01 사용자 중심: 중심 구체 + 동심원 */
.shape--sphere .shape-core{ border-radius:50%; border:1px solid rgba(255,81,117,.72); box-shadow:inset 0 0 18px rgba(255,255,255,.9),0 12px 22px rgba(147,44,101,.2); }
.shape--sphere .shape-core::before{ inset:13px; border-radius:50%; background:radial-gradient(circle at 28% 22%,#fff 0 8%,#ff9aab 25%,#ea4f75 58%,#6c59b5 100%); box-shadow:inset -8px -10px 18px rgba(44,24,93,.28),0 8px 18px rgba(133,39,92,.28); }
.shape--sphere .shape-core::after{ inset:-7px; border:1px solid rgba(77,102,203,.58); border-radius:50%; transform:rotateX(62deg); }
/* 02 정량 검증: 기준 격자·축·측정점을 갖춘 유리 레이더 차트 */
.shape--torus .shape-core{ width:80px; height:80px; filter:drop-shadow(0 11px 12px rgba(82,53,137,.2)); }
.radar-chart{ width:100%; height:100%; overflow:visible; }
.radar-grid,.radar-axis,.radar-area,.radar-point{ vector-effect:non-scaling-stroke; }
.radar-grid{ fill:none; stroke:rgba(91,88,128,.25); stroke-width:1; }
.radar-grid--outer{ fill:rgba(109,98,194,.035); stroke:rgba(91,88,128,.42); }
.radar-axis{ stroke:rgba(91,88,128,.18); stroke-width:1; }
.radar-area{ fill:url(#radar-fill); fill-opacity:.72; stroke:url(#radar-stroke); stroke-width:1.8; stroke-linejoin:round; transform-box:fill-box; transform-origin:center; transition:transform .55s var(--ease),fill-opacity .4s; }
.radar-point{ fill:#fff; stroke:#d85f82; stroke-width:1.8; filter:drop-shadow(0 2px 2px rgba(70,45,122,.2)); transform-box:fill-box; transform-origin:center; transition:transform .42s var(--ease); }
.radar-point:nth-of-type(2),.radar-point:nth-of-type(5){ stroke:#7568ca; }
.radar-point:nth-of-type(3),.radar-point:nth-of-type(4){ stroke:#34bfd9; }
.shape--torus:hover .radar-area,.shape--torus[aria-selected="true"] .radar-area{ transform:scale(1.055); fill-opacity:.9; }
.shape--torus:hover .radar-point,.shape--torus[aria-selected="true"] .radar-point{ transform:scale(1.35); }
/* 03 협업: 맞물린 유리 링 */
.shape--cube .shape-core{ border:9px solid rgba(255,84,111,.86); border-radius:50%; box-shadow:inset 0 0 0 2px rgba(255,255,255,.72),0 10px 19px rgba(209,35,89,.2); transform:translateX(-10px); }
.shape--cube .shape-core::before{ inset:-9px; border:9px solid rgba(83,93,190,.82); border-radius:50%; transform:translateX(28px); box-shadow:inset 0 0 0 2px rgba(255,255,255,.68),0 10px 18px rgba(53,58,141,.18); }
.shape--cube:hover .shape-core,.shape--cube[aria-selected="true"] .shape-core{ transform:scale(1.1) translateX(-14px); }
.shape--cube:hover .shape-core::before{ transform:translateX(36px); }
/* 04 다중 플랫폼: 겹쳐진 유리 화면 */
.shape--capsule .shape-core{ width:54px; height:66px; border-radius:14px; background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(255,94,126,.72)); border:1px solid rgba(255,69,110,.7); box-shadow:0 13px 22px rgba(77,53,134,.2),inset 0 0 12px rgba(255,255,255,.86); }
.shape--capsule .shape-core::before,.shape--capsule .shape-core::after{ inset:0; border-radius:14px; border:1px solid rgba(255,255,255,.68); }
.shape--capsule .shape-core::before{ background:linear-gradient(145deg,rgba(76,206,235,.82),rgba(91,75,182,.76)); transform:translate(-14px,8px) rotate(-8deg); }
.shape--capsule .shape-core::after{ background:linear-gradient(145deg,rgba(255,179,56,.8),rgba(255,69,115,.78)); transform:translate(14px,-7px) rotate(7deg); }
.shape--capsule:hover .shape-core::before{ transform:translate(-20px,10px) rotate(-12deg); }
.shape--capsule:hover .shape-core::after{ transform:translate(20px,-10px) rotate(12deg); }
/* 05 AI 활용: 선은 최하단, 다섯 노드는 상단에 분리 배치 */
.shape--rings .shape-core{ width:76px; height:76px; filter:drop-shadow(0 9px 9px rgba(82,53,137,.18)); }
.ai-line{ position:absolute; left:8px; top:37px; z-index:0; width:60px; height:1px; background:rgba(103,108,131,.34); transform-origin:center; }
.ai-line--a{ transform:rotate(36deg); }
.ai-line--b{ transform:rotate(-38deg); }
.ai-node{ position:absolute; z-index:2; width:19px; height:19px; border-radius:50%; border:1px solid rgba(255,255,255,.76); box-shadow:inset -4px -5px 8px rgba(57,35,104,.18),0 5px 9px rgba(74,47,117,.16); }
.ai-node--center{ left:29px; top:29px; z-index:3; background:radial-gradient(circle at 28% 24%,#fff 0 8%,#ff6a82 48%,#6757bd 100%); }
.ai-node--tl{ left:2px; top:5px; background:linear-gradient(145deg,#ffb4c2,#ff6683); }
.ai-node--tr{ right:1px; top:7px; background:linear-gradient(145deg,#83ebf5,#25bad8); }
.ai-node--bl{ left:6px; bottom:3px; background:linear-gradient(145deg,#9d8ff0,#6555cf); }
.ai-node--br{ right:3px; bottom:4px; background:linear-gradient(145deg,#ffc176,#ff9134); }
.shape--rings:hover .shape-core{ transform:scale(1.15) rotate(8deg); }
/* 06 설계에서 구현까지: 세 막대를 분리한 H → N 구조 */
.shape--bars .shape-core{ width:72px; height:72px; }
.n-stroke{ position:absolute; display:block; border:1px solid rgba(255,255,255,.84); box-shadow:inset 0 0 8px rgba(255,255,255,.5),0 8px 14px rgba(71,50,105,.17); }
.n-stroke--left,.n-stroke--right{ top:5px; z-index:2; width:12px; height:62px; border-radius:7px; }
.n-stroke--left{ left:5px; background:linear-gradient(100deg,#ffd4de,#ff5e7c); }
.n-stroke--right{ right:5px; background:linear-gradient(100deg,#8c83e3,#625ac0); }
.n-stroke--middle{ left:5px; top:31px; z-index:1; width:62px; height:10px; border-radius:7px; background:linear-gradient(100deg,#ff9db2,#ff6685 42%,#54cfe5); transform:rotate(0); transform-origin:center; transition:transform .55s var(--ease); }
.shape--bars:hover .n-stroke--middle,.shape--bars[aria-selected="true"] .n-stroke--middle{ transform:rotate(45deg) scaleX(1.08); }

.strength-detail{
  position:relative; width:min(310px,28vw); min-height:194px; flex:0 0 min(310px,28vw);
  padding:28px 26px; overflow:hidden; cursor:pointer;
  animation:detailIn .48s var(--ease) both;
}
.strength-detail:focus-visible{ outline:2px solid var(--rose); outline-offset:4px; border-radius:12px; }
@keyframes detailIn{ from{ opacity:0; transform:translateX(24px); } to{ opacity:1; transform:none; } }
.strength-detail::before{
  content:""; position:absolute; width:170px; height:170px; right:-78px; top:-84px;
  border:1px solid rgba(201,96,95,.24); border-radius:50%;
}
.strength-detail-inner{ transition:opacity .22s, transform .38s var(--ease); }
.strength-detail.is-changing .strength-detail-inner{ opacity:0; transform:translateX(22px); }
.strength-detail h3{ margin:8px 0 14px; font-size:24px; font-weight:650; letter-spacing:-.035em; }
.strength-detail p{ font-size:15px; line-height:1.8; color:var(--on-paper-dim); }
.strength-hint{ margin-top:16px; font-size:11px; color:var(--on-paper-dim); letter-spacing:.08em; }
.strength-empty-hint{
  display:flex; align-items:center; justify-content:flex-end;
  max-width:620px; font-size:13.5px; font-weight:400; line-height:1.7;
  color:var(--on-paper-dim); letter-spacing:-.01em;
}
.strength-empty-hint[hidden]{ display:none; }

@media (max-width:960px){
  .strength-objects{ height:auto; min-height:250px; flex-wrap:wrap; justify-content:flex-start; }
  .strength-object{ flex:1 1 92px; }
  .strength-detail{ width:100%; flex:1 0 100%; min-height:160px; margin-top:34px; border-left:0; border-top:1px solid var(--line-paper); }
}
@media (max-width:680px){
  .strengths{ margin-top:42px; }
  .strength-explorer{ min-height:250px; }
  .strength-intro{ margin-bottom:20px; padding-inline:0; }
  .strength-heading{ transform:scaleX(1.04); }
  .strength-objects{ overflow-x:visible; gap:6px; padding:22px 10px 28px; border-radius:18px; }
  .strength-object{ flex:1 1 calc(33.333% - 6px); width:auto; height:118px; }
  .strength-objects.has-selection .strength-object{ flex-basis:calc(33.333% - 6px); }
  .strength-objects.has-selection .strength-object[aria-selected="true"]{ flex-basis:calc(33.333% - 6px); transform:scale(1.08); }
  .shape-core{ width:58px; height:58px; }
  .shape--rings .shape-core{ width:68px; height:68px; }
  .shape--rings .ai-line{ left:7px; top:33px; width:54px; }
  .shape--rings .ai-node--center{ left:25px; top:25px; }
  .strength-detail{ order:2; width:100%; flex-basis:100%; padding:26px 18px; }
}

@media (max-width:860px){
  .about-grid{ grid-template-columns:1fr; gap:30px; }
  /* 모바일에서는 사진 옆에 이름이 오도록 가로로 배치 */
  .portrait-wrap{ display:flex; align-items:center; gap:30px; }
  .portrait-frame{ width:112px; margin-left:14px; }   /* 왼쪽 원이 잘리지 않도록 여백 */
  .portrait{ box-shadow:0 0 0 5px var(--paper), 0 10px 24px -12px rgba(90,60,60,.5); }
  .pf-ring{ left:-14px; top:-11px; }
  .pf-orb{ width:46px; right:-16px; bottom:-1px; }
  .pf-dot{ width:13px; left:-1px; bottom:14px; }
  .portrait-cap{ margin-top:0; }
  .portrait-cap b{ font-size:22px; }
  .portrait-meta{ flex:1; margin-top:0; }
  .portrait-edu{ margin-top:10px; padding-top:10px; }
  .strengths{ grid-template-columns:1fr; }
}

/* 프로젝트와 경력 태그 */
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:18px; }
.chip{ padding:5px 11px; border-radius:100px; border:1px solid var(--line-ink);
  font-size:11.5px; letter-spacing:.02em; color:var(--on-ink-dim); }

/* ══════════════════ SKILLS (궤도 그래픽) ══════════════════ */
.skills-grid{ display:grid; grid-template-columns:400px minmax(0,1fr); gap:60px; align-items:center; }
.orbit{ --orbit-r:150px; position:relative; width:100%; aspect-ratio:1; max-width:400px; margin-inline:auto; }
.orbit svg{ position:absolute; inset:0; width:100%; height:100%; }
.orbit .ring{ fill:none; stroke:rgba(143,158,196,.27); }
.orbit .ring--dash{ stroke-dasharray:2 8; stroke-linecap:round; transform-origin:50% 50%;
  animation:spin 46s linear infinite; }
.orbit .ring--dash-2{ animation:spin 66s linear infinite reverse; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.orbit-core{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:132px; height:132px; border-radius:50%;
  display:grid; place-content:center; text-align:center;
  background:radial-gradient(circle at 32% 26%, #f8e4e0, #dd9291 44%, #c05e5e 100%);
  color:#fff; box-shadow:0 0 60px -12px rgba(201,96,95,.6);
}
.orbit-core .en{ font-family:var(--en); font-weight:600; font-size:19px; letter-spacing:-.02em; }
.orbit-core .ko{ font-size:11.5px; opacity:.9; margin-top:2px; }
.orbit-tag{
  position:absolute; transform:translate(-50%,-50%); white-space:nowrap;
  padding:7px 14px; border-radius:100px; font-size:12.5px; font-weight:500;
  background:linear-gradient(135deg, rgba(207,212,226,.18), rgba(103,108,131,.14));
  border:1px solid rgba(207,212,226,.34); color:#eef1f8;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), 0 8px 24px rgba(95,107,168,.08);
  transition:background .25s, border-color .25s, color .25s, transform .25s var(--ease);
}
.orbit-tag:hover{
  background:linear-gradient(135deg, rgba(207,212,226,.26), rgba(143,158,196,.20));
  border-color:rgba(207,212,226,.62); color:#fff;
}

.skill-group{ padding:22px 0; border-top:1px solid var(--line-ink); }
.skill-group:first-child{ border-top:0; padding-top:0; }
.skill-group h3{ font-family:var(--en); font-size:13px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rose); margin-bottom:12px; }
.skill-group p{ font-size:15.5px; line-height:1.8; color:var(--on-ink-soft); }

@media (max-width:960px){
  .skills-grid{ grid-template-columns:1fr; gap:44px; }
  .orbit{ max-width:340px; --orbit-r:128px; }
  .orbit-tag{ font-size:11.5px; padding:6px 11px; }
  .orbit-core{ width:116px; height:116px; }
}
@media (max-width:520px){
  .orbit{ max-width:250px; --orbit-r:96px; }
  .orbit-tag{ font-size:10.5px; padding:5px 9px; }
  .orbit-core{ width:96px; height:96px; }
  .orbit-core .en{ font-size:16px; }
  .orbit-core .ko{ font-size:10px; }
}

/* ══════════════════ WORKS (지그재그) ══════════════════ */
.work{
  display:grid; grid-template-columns:repeat(2,1fr); gap:56px; align-items:center;
  padding-block:64px; border-top:1px solid var(--line-paper);
}
.work:first-of-type{ border-top:0; padding-top:0; }
.work--flip .work-media{ order:2; }
.work-media{
  position:relative; aspect-ratio:3/2; display:grid; place-items:center;
  padding:32px; border-radius:var(--r); overflow:hidden;
  background:linear-gradient(158deg, #ffffff 0%, #f1ede9 100%);
  border:1px solid var(--line-paper);
  box-shadow:0 26px 60px -34px rgba(90,60,60,.5);
}
/* 이미지는 배경이 투명한 컷아웃 — 잘리지 않고 안쪽에 꽉 맞춰 들어갑니다 */
.work-media img{
  width:100%; height:100%; object-fit:contain;
  filter:drop-shadow(0 14px 26px rgba(60,40,40,.13));
  transition:transform .8s var(--ease);
}
.work-slides img.is-feature-enlarged{ scale:1.35; }
.work-slides img:is([src*="bloom_4.png"],[src*="bloom_9.png"]){ scale:1.15; }
.work-slides img:is([src*="bappul_2.png"],[src*="bappul_3.png"],[src*="bappul_4.png"],[src*="bappul_9.png"]){ scale:1.12; }
.work-slides img:is([src*="unirun_2.png"],[src*="unirun_3.png"],[src*="unirun_4.png"],[src*="unirun_5.png"],[src*="unirun_7.png"]){ scale:1.12; }
.work-slides img.is-feature-shifted{ translate:-5% 0; }
.work-media:hover img{ transform:scale(1.045); }

/* ── 프로젝트 이미지 슬라이드쇼 (2초마다 크로스페이드) ──────────
   이미지를 겹쳐 쌓고 opacity만 바꿔 부드럽게 교차시킵니다.      */
.work-slides{ position:relative; width:100%; height:100%; cursor:zoom-in; }
.work-slides:focus-visible{ outline:2px solid var(--rose); outline-offset:7px; border-radius:10px; }
.work-slides img{
  position:absolute; inset:0;
  opacity:0; transition:opacity .75s var(--ease), transform .8s var(--ease);
  pointer-events:none;
}
.work-slides img.is-on{ opacity:1; }

/* 인디케이터 점 */
.sl-dots{
  position:absolute; left:50%; bottom:14px; transform:translateX(-50%);
  display:flex; gap:8px; padding:7px 11px; z-index:2;
  border-radius:999px; background:rgba(255,255,255,.62);
  backdrop-filter:blur(6px); border:1px solid rgba(120,90,90,.12);
  opacity:0; transition:opacity .35s var(--ease);
}
.work-media:hover .sl-dots,
.work-media:focus-within .sl-dots{ opacity:1; }
.sl-dot{
  width:7px; height:7px; padding:0; border:0; border-radius:50%;
  background:rgba(90,60,60,.26); cursor:pointer;
  transition:background .3s var(--ease), width .3s var(--ease);
}
.sl-dot[aria-current="true"]{ width:18px; border-radius:999px; background:var(--rose); }

/* 좌우 화살표 */
.sl-nav{
  position:absolute; top:50%; z-index:2; translate:0 -50%;
  display:grid; place-items:center; width:34px; height:34px;
  border:1px solid rgba(120,90,90,.14); border-radius:50%;
  background:rgba(255,255,255,.72); backdrop-filter:blur(6px);
  color:#5a3c3c; font-size:14px; line-height:1; cursor:pointer;
  opacity:0; transition:opacity .35s var(--ease), background .25s var(--ease);
}
.work-media:hover .sl-nav,
.work-media:focus-within .sl-nav{ opacity:1; }
.sl-nav:hover{ background:#fff; }
.sl-nav:focus-visible{ opacity:1; outline:2px solid var(--rose); outline-offset:2px; }
.sl-prev{ left:12px; }
.sl-next{ right:12px; }
.work-view-hint{
  position:absolute; top:14px; right:14px; z-index:3;
  display:flex; align-items:center; min-height:31px; padding:7px 11px;
  border:1px solid rgba(120,90,90,.12); border-radius:999px;
  background:rgba(255,255,255,.82); color:#5f5051;
  font-size:10.5px; font-weight:600; letter-spacing:-.01em; line-height:1;
  box-shadow:0 5px 18px rgba(45,30,34,.08); backdrop-filter:blur(7px);
  cursor:pointer; transition:background .25s,color .25s,transform .25s;
}
.work-media:hover .work-view-hint,
.work-media:focus-within .work-view-hint{
  background:var(--rose); color:#fff; transform:translateY(-2px);
}
.work-view-hint:focus-visible{ outline:2px solid var(--rose); outline-offset:3px; }
@media (max-width:860px), (hover:none), (pointer:coarse){
  .work-view-hint{ top:10px; right:10px; min-height:29px; padding:7px 10px; }
}

/* ── 프로젝트 이미지 크게 보기 ─────────────────────────────── */
body.lightbox-open{ overflow:hidden; }
body.lightbox-open .cur-ring{ border-color:rgba(201,96,95,.95); background:rgba(201,96,95,.12); }
body.lightbox-open .cur-ring2{ border-color:rgba(224,161,158,.9); }
body.lens-on #cur{ opacity:0 !important; }
.work-lightbox[hidden]{ display:none; }
.work-lightbox{
  position:fixed; inset:0; z-index:10000;
  display:grid; place-items:center; padding:32px;
  background:rgba(22,19,21,.7); backdrop-filter:blur(8px);
  animation:lightboxIn .28s ease both;
}
@keyframes lightboxIn{ from{ opacity:0; } to{ opacity:1; } }
.lightbox-window{
  width:min(1000px,calc(100vw - 64px)); height:min(620px,calc(100vh - 64px)); padding:0;
  display:grid; grid-template-rows:auto minmax(0,1fr); overflow:hidden;
  border:1px solid rgba(58,45,48,.14); border-radius:22px;
  background:var(--paper); box-shadow:0 30px 90px rgba(15,10,12,.3);
  animation:lightboxWindowIn .35s var(--ease) both;
}
@keyframes lightboxWindowIn{ from{ opacity:0; transform:translateY(12px) scale(.98); } to{ opacity:1; transform:none; } }
.lightbox-header{
  display:flex; align-items:center; justify-content:space-between; gap:24px;
  min-height:82px; padding:18px 20px 18px 26px; border-bottom:1px solid var(--line-paper);
}
.lightbox-eyebrow{ display:block; margin-bottom:4px; color:var(--rose); font-family:var(--en); font-size:10px; font-weight:600; letter-spacing:.16em; }
.lightbox-title{ margin:0; color:var(--on-paper); font-size:18px; font-weight:600; letter-spacing:-.02em; }
.lightbox-body{ min-height:0; display:grid; grid-template-columns:220px minmax(0,1fr); }
.lightbox-sidebar{ min-height:0; padding:22px 16px; overflow:auto; border-right:1px solid var(--line-paper); background:var(--paper-2); }
.lightbox-files{ display:grid; gap:5px; }
.lightbox-file{
  width:100%; min-width:0; display:grid; grid-template-columns:28px minmax(0,1fr); align-items:center; gap:9px;
  padding:11px 10px; border:0; border-radius:9px; background:transparent; color:var(--on-paper-dim);
  text-align:left; cursor:pointer; transition:background .2s,color .2s,transform .2s;
}
.lightbox-file:hover{ background:rgba(207,94,97,.08); color:var(--on-paper); transform:translateX(2px); }
.lightbox-file[aria-current="true"]{ background:var(--rose); color:#fff; }
.lightbox-file:focus-visible,.lightbox-close:focus-visible{ outline:2px solid var(--rose); outline-offset:2px; }
.lightbox-file-no{ font-family:var(--en); font-size:11px; font-weight:600; letter-spacing:.08em; }
.lightbox-file-name{
  display:-webkit-box; overflow:hidden; font-size:11.5px; line-height:1.45;
  -webkit-box-orient:vertical; -webkit-line-clamp:2;
}
.lightbox-preview{
  min-width:0; min-height:0; position:relative; display:grid; grid-template-rows:minmax(0,1fr) auto;
  gap:14px; margin:0; padding:26px; background:#ebe8e6;
}
.lightbox-image-stage{ min-height:0; position:relative; display:grid; place-items:center; overflow:hidden; padding:20px; border-radius:12px; background:#f6f4f2; }
.lightbox-img{
  display:block; width:100%; height:100%; min-width:0; min-height:0; object-fit:contain;
  filter:drop-shadow(0 14px 28px rgba(45,30,34,.14));
  animation:lightboxImageIn .35s var(--ease) both;
}
.lightbox-image-stage.is-series .lightbox-img{ width:100%; height:100%; }
.lightbox-image-stage.is-enlarged .lightbox-img{ scale:var(--lightbox-scale,1.45); translate:var(--lightbox-shift-x,0) 0; }
.lightbox-lens{
  position:absolute; z-index:3; left:0; top:0; width:220px; height:220px; display:none; overflow:hidden;
  border:2px solid rgba(201,96,95,.78); border-radius:50%; pointer-events:none;
  background:#f6f4f2; box-shadow:0 12px 34px rgba(42,25,30,.22),inset 0 0 0 4px rgba(255,255,255,.7);
  translate:-50% -50%;
}
.lightbox-lens-img{ position:absolute; display:block; max-width:none; max-height:none; pointer-events:none; }
.lightbox-image-stage.is-magnifying .lightbox-lens{ display:block; }
.lightbox-zoom-hint{
  position:absolute; z-index:2; top:14px; right:14px; display:flex; align-items:center; gap:7px;
  padding:8px 11px; border:1px solid rgba(75,60,64,.12); border-radius:999px;
  background:rgba(255,255,255,.82); color:#695f61; font-size:10.5px; font-weight:500;
  box-shadow:0 5px 18px rgba(45,30,34,.08); backdrop-filter:blur(7px);
  pointer-events:none; transition:opacity .2s,transform .2s;
}
.lightbox-zoom-hint::before{ content:'⌕'; color:var(--rose); font-family:var(--en); font-size:15px; line-height:1; }
.lightbox-image-stage.is-magnifying .lightbox-zoom-hint{ opacity:0; transform:translateY(-3px); }
@keyframes lightboxImageIn{ from{ opacity:0; transform:scale(.975); } to{ opacity:1; transform:none; } }
.lightbox-close{ flex:0 0 auto; display:grid; place-items:center; width:42px; height:42px; padding:0 0 2px; border:1px solid var(--line-paper); border-radius:50%; background:transparent; color:var(--on-paper); font-size:24px; font-weight:300; line-height:1; cursor:pointer; transition:background .2s,transform .2s; }
.lightbox-close:hover{ background:var(--rose); color:#fff; border-color:var(--rose); transform:rotate(5deg); }
.lightbox-meta{
  min-width:0; display:flex; align-items:center; justify-content:space-between; gap:22px; color:var(--on-paper-dim); font-size:12px; line-height:1.5;
}
.lightbox-count{ flex:0 0 auto; margin-left:auto; color:var(--rose); font-family:var(--en); font-weight:600; letter-spacing:.08em; }
.lightbox-caption{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:700px){
  .work-lightbox{ padding:10px; }
  .lightbox-window{ width:calc(100vw - 20px); height:min(86vh,760px); border-radius:17px; }
  .lightbox-header{ min-height:70px; padding:14px 14px 14px 18px; }
  .lightbox-title{ font-size:15px; }
  .lightbox-close{ width:38px; height:38px; }
  .lightbox-body{ grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
  .lightbox-sidebar{ padding:10px 12px; overflow-x:auto; overflow-y:hidden; border-right:0; border-bottom:1px solid var(--line-paper); }
  .lightbox-files{ display:flex; width:max-content; gap:6px; }
  .lightbox-file{ width:auto; grid-template-columns:auto; padding:9px 13px; }
  .lightbox-file:hover{ transform:none; }
  .lightbox-file-name{ display:none; }
  .lightbox-preview{ padding:14px; gap:10px; }
  .lightbox-image-stage{ padding:10px 12px; border-radius:9px; }
  .lightbox-lens{ display:none !important; }
  .lightbox-zoom-hint{ display:none; }
  .lightbox-caption{ display:none; }
}

@media (max-width:860px){
  /* 터치 기기에는 hover가 없으므로 조작 요소를 항상 보여줍니다 */
  .sl-dots{ opacity:1; bottom:10px; }
  .sl-nav{ opacity:1; width:30px; height:30px; }
  .sl-prev{ left:8px; } .sl-next{ right:8px; }
}
@media (hover:none), (pointer:coarse){
  /* Windows 터치 겸용 PC처럼 기본 포인터가 coarse인 환경에서도 조작 요소를 노출합니다 */
  .sl-dots{ opacity:1; }
  .sl-nav{ opacity:1; }
}
@media (prefers-reduced-motion:reduce){
  /* 움직임 최소화 설정에서도 기능은 유지하고 전환 효과만 즉시 처리합니다 */
  .work-slides img{ transition:none; }
}
/* 프로젝트 번호 + 분류 — 장식을 덜어낸 편집 디자인식 메타 줄 */
.work-kicker{
  display:flex; align-items:center; gap:14px; font-family:var(--en);
  font-size:11.5px; font-weight:600; letter-spacing:.13em;
  text-transform:uppercase; color:var(--rose);
}
.work-n{
  display:grid; place-items:center; flex:0 0 auto;
  width:38px; height:32px; background:var(--rose); color:#fff;
  font-size:12px; font-weight:600; letter-spacing:.04em;
}
.work:nth-child(odd) .work-n{ border-radius:9px 9px 9px 0; }
.work:nth-child(even) .work-n{ border-radius:9px 9px 0 9px; }
.work h3{ margin:18px 0 12px; font-size:clamp(23px,3.2vw,31px); font-weight:600; letter-spacing:-.03em; line-height:1.3; }
.work-sum{ font-size:16px; line-height:1.8; color:var(--on-paper-dim); }
.work-facts{ display:flex; flex-wrap:wrap; gap:8px 30px; margin:22px 0 18px;
  padding:16px 0; border-block:1px solid var(--line-paper); font-size:14px; }
.work-facts dt{ display:inline; font-weight:600; color:var(--rose); margin-right:8px; }
.work-facts dd{ display:inline; margin:0; color:var(--on-paper-dim); }
.work ul{ display:grid; gap:9px; margin-bottom:22px; }
.work li{ position:relative; padding-left:16px; font-size:14.5px; line-height:1.72; color:var(--on-paper-dim); }
.work li::before{ content:""; position:absolute; left:0; top:10px; width:6px; height:1px; background:var(--rose); }
.work li b{ color:var(--on-paper); font-weight:600; }
.band--paper .chip{ border-color:var(--line-paper); color:var(--on-paper-dim); }

@media (max-width:860px){
  .work{ grid-template-columns:1fr; gap:26px; padding-block:48px; }
  .work--flip .work-media{ order:0; }   /* 모바일: 항상 이미지 먼저 */
  .work-media{ padding:20px; }
  .work-facts{ gap:6px; flex-direction:column; }
  /* 폭이 좁아 강제 줄바꿈이 오히려 어색해지므로 모바일에서는 무시하고 자연스럽게 흘립니다 */
  .work-sum br{ display:none; }
}

/* ══════════════════ AWARDS ══════════════════ */
.aw-grid{ display:grid; grid-template-columns:1.35fr 1fr; gap:44px; align-items:start; }
.aw-table{ width:100%; border-collapse:collapse; font-size:14.5px; }
.aw-table th{
  text-align:left; padding:0 12px 12px 0; font-family:var(--en); font-size:11.5px;
  font-weight:600; letter-spacing:.12em; text-transform:uppercase;
  color:var(--on-paper-dim); border-bottom:1px solid var(--on-paper);
}
.aw-table td{ padding:14px 12px 14px 0; border-bottom:1px solid var(--line-paper); vertical-align:top; }
.aw-table td:last-child{ padding-right:0; white-space:nowrap; color:var(--on-paper-dim); font-family:var(--en); font-size:13px; }
.aw-table .res{ font-weight:600; color:var(--rose); }
.aw-side{ display:grid; gap:14px; }
.aw-box{ padding:24px; border:1px solid var(--line-paper); border-radius:var(--r); background:var(--paper-2); }
.aw-box h3{ font-family:var(--en); font-size:12px; font-weight:600; letter-spacing:.12em;
  text-transform:uppercase; color:var(--rose); margin-bottom:14px; }
.aw-box li{ padding:9px 0; border-top:1px solid var(--line-paper); font-size:14.5px; line-height:1.6; }
.aw-box li:first-child{ border-top:0; padding-top:0; }
.aw-box li span{ display:block; font-size:12.5px; color:var(--on-paper-dim); margin-top:3px; }

@media (max-width:900px){ .aw-grid{ grid-template-columns:1fr; gap:32px; } }
@media (max-width:620px){
  .aw-table thead{ display:none; }
  .aw-table tr{ display:block; padding:16px 0; border-bottom:1px solid var(--line-paper); }
  .aw-table td{ display:block; padding:0; border:0; }
  .aw-table td:nth-child(1){ font-weight:600; margin-bottom:4px; }
  .aw-table td:last-child{ margin-top:4px; }
}

/* ══════════════════ CONTACT ══════════════════ */
.contact{ position:relative; text-align:center; padding-block:128px 96px; overflow:hidden; }
.contact-orb{
  position:absolute; left:50%; top:34%; transform:translate(-50%,-50%);
  width:min(560px,90vw); aspect-ratio:1; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(201,96,95,.30), rgba(103,108,131,.14) 46%, transparent 68%);
  filter:blur(28px);
}
.contact .inner{ position:relative; }
.contact h2{
  font-family:var(--en); font-weight:600; font-size:clamp(38px,7.4vw,88px);
  line-height:1.02; letter-spacing:-.045em;
}
.contact h2 .d{ color:var(--rose-soft); }
.contact p{ margin-top:22px; font-size:16.5px; color:var(--on-ink-dim); line-height:1.8; }
.mail{
  display:inline-block; margin-top:34px; font-family:var(--en);
  font-size:clamp(19px,3.4vw,30px); font-weight:500; letter-spacing:-.02em;
  padding-bottom:8px; border-bottom:1px solid var(--line-ink); transition:.25s;
}
.mail:hover{ color:var(--rose-soft); border-color:var(--rose); }
.links{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:40px; }
.links a{
  min-height:46px; display:inline-flex; align-items:center; gap:8px; padding:0 22px;
  border:1px solid var(--line-ink); border-radius:100px; font-size:14px; transition:.25s var(--ease);
}
.links a:hover{ background:var(--on-ink); color:var(--ink); border-color:var(--on-ink); }

footer{ border-top:0; overflow:hidden; }
.foot-signature{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:stretch; padding-block:clamp(46px,5vw,64px); }
.foot-signature::before,.foot-signature::after{ content:""; height:1px; background:rgba(242,239,236,.5); }
.foot-signature::before{ align-self:start; margin-top:1px; }
.foot-signature::after{ align-self:end; margin-bottom:1px; }
.foot-signature img{ display:block; width:clamp(168px,19vw,248px); height:auto; filter:invert(1); opacity:.72; }
.foot{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px;
  padding-block:26px; font-size:12.5px; color:var(--on-ink-dim); }
@media (max-width:640px){
  .foot-signature{ padding-block:40px; }
  .foot-signature img{ width:142px; }
}

/* ══════════════════ ENTRY INTRO — HANUL DESIGN PRINCIPLES ══════════════════ */
body.intro-active{ overflow:hidden; }
.entry-intro{
  position:fixed; inset:0; z-index:1000; display:grid; place-items:center;
  padding:clamp(24px,5vw,72px); overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,rgba(103,108,131,.12),transparent 42%),
    var(--ink);
  color:var(--on-ink); opacity:1; visibility:visible;
  transition:opacity .65s var(--ease),visibility .65s;
}
.entry-intro.is-leaving{ opacity:0; visibility:hidden; pointer-events:none; }
.entry-skip{
  position:absolute; top:24px; right:28px; padding:8px 0;
  font-family:var(--en); font-size:10px; font-weight:500; letter-spacing:.16em;
  color:var(--on-ink-dim); border-bottom:1px solid var(--line-ink);

/* ── 프로젝트 이미지 슬라이드쇼 ───────────────────────────────
   · 2초마다 다음 이미지로 크로스페이드
   · 화면에 보일 때만 돌아갑니다 (안 보이면 타이머를 끕니다)
   · 키보드로 버튼을 조작하는 동안에는 잠시 멈춥니다
   · '움직임 최소화' 설정에서는 페이드 없이 즉시 전환됩니다
   전환 간격을 바꾸려면 아래 SLIDE_MS 숫자만 고치면 됩니다.   */
const SLIDE_MS = 2000;

document.querySelectorAll('.work-media[data-slideshow]').forEach(media => {
  const imgs = [...media.querySelectorAll('.work-slides img')];
  if (imgs.length < 2) return;

  const dots   = [...media.querySelectorAll('.sl-dot')];
  let idx = 0, timer = null, visible = false, held = false;

  const show = n => {
    idx = (n + imgs.length) % imgs.length;
    imgs.forEach((im, k) => im.classList.toggle('is-on', k === idx));
    dots.forEach((d, k) => d.setAttribute('aria-current', k === idx ? 'true' : 'false'));
  };
  const stop  = () => { clearInterval(timer); timer = null; };
  const sync  = () => {
    stop();
    if (visible && !held) timer = setInterval(() => show(idx + 1), SLIDE_MS);
  };
  const jump  = n => { show(n); sync(); };   // 수동 조작 시 타이머를 다시 시작해 바로 안 넘어가게 함

  media.querySelector('.sl-prev')?.addEventListener('click', () => jump(idx - 1));
  media.querySelector('.sl-next')?.addEventListener('click', () => jump(idx + 1));
  dots.forEach((d, k) => d.addEventListener('click', () => jump(k)));

  const hold = v => { held = v; sync(); };
  media.addEventListener('focusin',    () => hold(true));
  media.addEventListener('focusout',   () => hold(false));

  if ('IntersectionObserver' in window) {
    new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); },
      { threshold: .25 }).observe(media);
  } else {
    /* 구형 브라우저에서는 화면 관찰 없이 자동 전환 자체를 유지합니다 */
    visible = true;
    sync();
  }
});

const lightbox = document.querySelector('.work-lightbox');
const lightboxImg = lightbox.querySelector('.lightbox-img');
const lightboxCount = lightbox.querySelector('.lightbox-count');
const lightboxCaption = lightbox.querySelector('.lightbox-caption');
const lightboxClose = lightbox.querySelector('.lightbox-close');
const lightboxTitle = lightbox.querySelector('.lightbox-title');
const lightboxFiles = lightbox.querySelector('.lightbox-files');
const lightboxStage = lightbox.querySelector('.lightbox-image-stage');
const lightboxLens = lightbox.querySelector('.lightbox-lens');
const lightboxLensImg = lightbox.querySelector('.lightbox-lens-img');
let lightboxItems = [], lightboxIndex = 0, lightboxTrigger = null;

const renderLightbox = () => {
  const item = lightboxItems[lightboxIndex];
  lightboxImg.classList.remove('lightbox-img');
  void lightboxImg.offsetWidth;
  lightboxImg.classList.add('lightbox-img');
  lightboxImg.src = item.src;
  lightboxImg.alt = item.alt;
  lightboxLensImg.src = item.src;
  lightboxStage.classList.remove('is-magnifying');
  lightboxStage.classList.toggle('is-series',!!item.series);
  lightboxStage.classList.toggle('is-enlarged',!!item.enlarge);
  lightboxStage.style.setProperty('--lightbox-scale',item.enlargeScale || 1.45);
  lightboxStage.style.setProperty('--lightbox-shift-x',item.shiftX || '0');
  document.body.classList.remove('lens-on');
  lightboxCount.textContent = `${lightboxIndex + 1} / ${lightboxItems.length}`;
  lightboxCaption.textContent = item.alt;
  [...lightboxFiles.children].forEach((button,index) => button.setAttribute('aria-current',String(index === lightboxIndex)));
};
const moveLightbox = step => {
  lightboxIndex = (lightboxIndex + step + lightboxItems.length) % lightboxItems.length;
  renderLightbox();
};
const openLightbox = slides => {
  const imgs = [...slides.querySelectorAll('img')];
  const workIndex = [...document.querySelectorAll('.work-slides')].indexOf(slides);
  const workImages = DATA.works[workIndex]?.images || [];
  lightboxItems = imgs.map((img,index) => ({ src:img.src, alt:img.alt, label:workImages[index]?.label, series:workImages[index]?.series, enlarge:workImages[index]?.enlarge, enlargeScale:workImages[index]?.enlargeScale, shiftX:workImages[index]?.shiftX }));
  lightboxIndex = Math.max(0, imgs.findIndex(img => img.classList.contains('is-on')));
  lightboxTrigger = slides;
  lightboxTitle.textContent = slides.closest('.work')?.querySelector('h3')?.textContent || 'Project images';
  lightboxFiles.innerHTML = lightboxItems.map((item,index) => {
    const filename = decodeURIComponent(new URL(item.src).pathname.split('/').pop());
    const label = item.label || item.alt || filename;
    return `<button class="lightbox-file" type="button" data-index="${index}" aria-current="false" aria-label="${label} 보기"><span class="lightbox-file-no">${String(index + 1).padStart(2,'0')}</span><span class="lightbox-file-name">${label}</span></button>`;
  }).join('');
  renderLightbox();
  lightbox.hidden = false;
  document.body.classList.add('lightbox-open');
  lightboxClose.focus();
};
const closeLightbox = () => {
  lightbox.hidden = true;
  lightboxImg.src = '';
  document.body.classList.remove('lightbox-open','lens-on');
  lightboxTrigger?.focus();
};

document.querySelectorAll('.work-slides').forEach(slides => {
  slides.addEventListener('click', () => openLightbox(slides));
  slides.addEventListener('keydown', e => {
    if (!['Enter',' '].includes(e.key)) return;
    e.preventDefault();
    openLightbox(slides);
  });
});
document.querySelectorAll('.work-view-hint').forEach(button => {
  button.addEventListener('click', () => {
    const slides = button.closest('.work-media')?.querySelector('.work-slides');
    if (slides) openLightbox(slides);
  });
});
lightboxClose.addEventListener('click', closeLightbox);
lightboxFiles.addEventListener('click', e => {
  const button = e.target.closest('.lightbox-file');
  if (!button) return;
  lightboxIndex = Number(button.dataset.index);
  renderLightbox();
});
function updateLightboxLens(e) {
  if (e.pointerType === 'touch') return;
  const stageRect = lightboxStage.getBoundingClientRect();
  const imageBox = lightboxImg.getBoundingClientRect();
  const imageRatio = lightboxImg.naturalWidth / lightboxImg.naturalHeight;
  const boxRatio = imageBox.width / imageBox.height;
  const shownWidth = imageRatio > boxRatio ? imageBox.width : imageBox.height * imageRatio;
  const shownHeight = imageRatio > boxRatio ? imageBox.width / imageRatio : imageBox.height;
  const imageLeft = imageBox.left + (imageBox.width - shownWidth) / 2;
  const imageTop = imageBox.top + (imageBox.height - shownHeight) / 2;
  const imageRight = imageLeft + shownWidth;
  const imageBottom = imageTop + shownHeight;
  if (e.clientX < imageLeft || e.clientX > imageRight || e.clientY < imageTop || e.clientY > imageBottom) {
    lightboxStage.classList.remove('is-magnifying');
    document.body.classList.remove('lens-on');
    return;
  }
  const x = e.clientX - stageRect.left;
  const y = e.clientY - stageRect.top;
  const imageX = e.clientX - imageLeft;
  const imageY = e.clientY - imageTop;
  const zoom = 2;
  const lensRadius = lightboxLens.offsetWidth / 2;
  lightboxStage.classList.add('is-magnifying');
  document.body.classList.add('lens-on');
  lightboxLens.style.left = `${x}px`;
  lightboxLens.style.top = `${y}px`;
  lightboxLensImg.style.width = `${shownWidth * zoom}px`;
  lightboxLensImg.style.height = `${shownHeight * zoom}px`;
  lightboxLensImg.style.left = `${lensRadius - imageX * zoom}px`;
  lightboxLensImg.style.top = `${lensRadius - imageY * zoom}px`;
}
lightboxStage.addEventListener('pointermove', updateLightboxLens);
lightboxStage.addEventListener('pointerleave', () => {
  lightboxStage.classList.remove('is-magnifying');
  document.body.classList.remove('lens-on');
});
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', e => {
  if (lightbox.hidden) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') moveLightbox(-1);
  if (e.key === 'ArrowRight') moveLightbox(1);
  if (e.key === 'Tab') {
    const controls = [...lightbox.querySelectorAll('button')].filter(button => !button.hidden);
    const first = controls[0], last = controls.at(-1);
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

/* ── CONTACT ── */
el('contact-msg').innerHTML   = DATA.contact.message;
el('contact-mail').textContent = DATA.contact.email;
el('contact-mail').href        = `mailto:${DATA.contact.email}`;
el('contact-links').innerHTML  = DATA.contact.links.map(l =>
  `<a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.label} <span aria-hidden="true">↗</span></a>`).join('');
el('foot-left').textContent = `© ${new Date().getFullYear()} kim hanul. All rights reserved.`;

/* ══════════════ 인터랙션 ══════════════ */

/* 1) 모바일 메뉴 */
const nav = el('nav'), burger = el('burger'), menu = el('menu');
burger.addEventListener('click', () => {
  const open = nav.classList.toggle('open');
  burger.setAttribute('aria-expanded', String(open));
  burger.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
});
menu.addEventListener('click', e => {
  if (e.target.tagName === 'A') {
    nav.classList.remove('open');
    burger.setAttribute('aria-expanded', 'false');
  }
});

/* 2) 스크롤에 따라 내비게이션 색 전환 */
const bands = [...document.querySelectorAll('.band')];

const onScroll = () => {
  nav.classList.toggle('is-stuck', scrollY > 8);

  const probe = 34;                                  // 내비 중앙 높이
  const here = bands.find(b => {
    const r = b.getBoundingClientRect();
    return r.top <= probe && r.bottom > probe;
  });
  nav.classList.toggle('is-paper', !!here &&
    (here.classList.contains('band--paper') || here.classList.contains('band--paper-alt')));
};
addEventListener('scroll', onScroll, { passive: true });
addEventListener('resize', onScroll);
onScroll();

/* 3) 현재 보고 있는 섹션 메뉴 활성화 */
const links = [...menu.querySelectorAll('a')];
const spy = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    links.forEach(a => a.setAttribute('aria-current', String(a.hash === `#${e.target.id}`)));
  });
}, { rootMargin: '-45% 0px -50% 0px' });
document.querySelectorAll('main section[id]').forEach(s => spy.observe(s));

/* 4) 스크롤 진입 시 fade-up */
const io = new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
    obs.unobserve(e.target);
  });
}, { threshold: .1, rootMargin: '0px 0px -60px 0px' });

document.querySelectorAll('.rv').forEach((n, i) => {
  n.style.transitionDelay = `${(i % 3) * 70}ms`;
  io.observe(n);
});

/* ── 5) 첫 화면 진입 시퀀스 ──────────────────────────────
   HANUL 워드마크를 보여준 뒤 기존 히어로를 시작합니다 */
document.querySelectorAll('.h-rv').forEach((n, i) => {
  n.style.transitionDelay = `${120 + i * 130}ms`;
});
const entryIntro = el('entry-intro');
const entrySkip = el('entry-skip');
const reduceEntryMotion = matchMedia('(prefers-reduced-motion:reduce)').matches;
let entryCollapseTimer;
let entryLeaveTimer;
let entryRemoveTimer;
let entryFinished = false;
const startHero = () => requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
const finishEntryIntro = (immediate = false) => {
  if (entryFinished) return;
  entryFinished = true;
  clearTimeout(entryCollapseTimer);
  clearTimeout(entryLeaveTimer);
  clearTimeout(entryRemoveTimer);
  if (immediate) {
    entryIntro?.remove();
    document.body.classList.remove('intro-active');
    startHero();
    return;
  }
  const entryCard = entryIntro?.querySelector('.entry-card');
  const headerMark = document.querySelector('.brand-mark');
  if (entryCard && headerMark) {
    const from = entryCard.getBoundingClientRect();
    const to = headerMark.getBoundingClientRect();
    entryCard.style.setProperty('--entry-dx', `${to.left + to.width / 2 - (from.left + from.width / 2)}px`);
    entryCard.style.setProperty('--entry-dy', `${to.top + to.height / 2 - (from.top + from.height / 2)}px`);
    entryCard.style.setProperty('--entry-scale', String(to.width / from.width));
  }
  entryIntro?.classList.add('is-collapsing');
  entryLeaveTimer = setTimeout(() => {
    entryIntro?.classList.add('is-leaving');
    document.body.classList.remove('intro-active');
    startHero();
    entryRemoveTimer = setTimeout(() => entryIntro?.remove(), 700);
  }, 900);
};
if (reduceEntryMotion) finishEntryIntro(true);
else {
  entryCollapseTimer = setTimeout(() => finishEntryIntro(false), 2300);
  entrySkip?.addEventListener('click', () => finishEntryIntro(false));
  entryIntro?.addEventListener('click', e => {
    if (e.target !== entrySkip) finishEntryIntro(false);
  });
  addEventListener('keydown', e => {
    if (['Escape','Enter',' '].includes(e.key)) finishEntryIntro(false);
  }, { once:true });
}

/* ── 6) 커서를 따라 움직이는 구체 ────────────────────────
   구체마다 따라오는 정도(data-depth)가 달라 깊이감이 생깁니다.
   광원(--lx/--ly)도 커서 쪽으로 옮겨져 진짜 구체처럼 보입니다.
   터치 기기와 모션 최소화 설정에서는 동작하지 않습니다. */
const hero  = el('home');
const orbs  = document.querySelector('.orbs');
const canHover = matchMedia('(hover:hover)').matches
              && !matchMedia('(prefers-reduced-motion:reduce)').matches;

if (hero && orbs && canHover) {
  const items = [...orbs.querySelectorAll('.orb')];
  let px = 0, py = 0, ticking = false;

  const apply = () => {
    ticking = false;
    orbs.style.setProperty('--lx', `${px * 14}%`);
    orbs.style.setProperty('--ly', `${py * 14}%`);
    items.forEach(o => {
      const d = parseFloat(o.dataset.depth) || 1;
      o.style.transform = `translate3d(${px * 24 * d}px, ${py * 18 * d}px, 0)`;
    });
  };
  const queue = () => { if (!ticking) { ticking = true; requestAnimationFrame(apply); } };

  hero.addEventListener('pointermove', e => {
    const r = hero.getBoundingClientRect();
    px = (e.clientX - r.left) / r.width  - .5;   // -0.5 ~ 0.5
    py = (e.clientY - r.top)  / r.height - .5;
    queue();
  }, { passive: true });

  hero.addEventListener('pointerleave', () => { px = py = 0; queue(); });
}

/* ── 7) 구체 주변 먼지 입자 ───────────────────────────────
   구체 둘레를 별가루처럼 도는 입자들. 화면 밖으로 나가면 멈춥니다.
   (커서 효과는 아래 8번의 커스텀 커서가 담당합니다)
   ─────────────────────────────────────────────────────── */
const fx = el('fx');
if (fx && hero && !matchMedia('(prefers-reduced-motion:reduce)').matches) {
  const ctx = fx.getContext('2d');
  const TAU = Math.PI * 2;
  const ROSE = [224, 161, 158], SLATE = [154, 161, 182];

  let W = 0, H = 0, dust = [], raf = 0, live = false;

  /* 캔버스 크기를 히어로에 맞추고 먼지를 다시 뿌립니다 */
  const resize = () => {
    const r = hero.getBoundingClientRect();
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    fx.width = W * dpr; fx.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    seedDust();
  };

  /* 구체 클러스터의 실제 위치를 읽어 그 둘레에 먼지를 배치 */
  const seedDust = () => {
    const orbEl = document.querySelector('.orbs');
    if (!orbEl) { dust = []; return; }
    const hr = hero.getBoundingClientRect(), or_ = orbEl.getBoundingClientRect();
    const cx = or_.left - hr.left + or_.width / 2;
    const cy = or_.top  - hr.top  + or_.height / 2;
    const R  = Math.max(or_.width, or_.height) * .5;

    // 화면이 좁으면 개수를 줄여 산만해지지 않게 합니다
    const count = Math.round(Math.max(28, Math.min(105, W * H / 9500)));

    dust = Array.from({ length: count }, () => ({
      cx, cy,
      a : Math.random() * TAU,                                   // 현재 각도
      d : R * (.55 + Math.random() * .8),                        // 중심에서의 거리
      sp: (0.00016 + Math.random() * 0.0004) * (Math.random() < .5 ? -1 : 1),
      s : .5 + Math.random() * 1.0,                              // 크기
      ph: Math.random() * TAU,                                   // 반짝임 위상
      pv: .5 + Math.random() * 1.3,                              // 반짝임 속도
      c : Math.random() < .62 ? ROSE : SLATE
    }));
  };

  const draw = (t) => {
    raf = requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);

    // ① 구체 주변 먼지
    for (const p of dust) {
      p.a += p.sp;
      const x = p.cx + Math.cos(p.a) * p.d;
      const y = p.cy + Math.sin(p.a) * p.d * .82;          // 살짝 눌러 타원 궤도
      const tw = .3 + .7 * Math.abs(Math.sin(t * .001 * p.pv + p.ph));
      // 빛 번짐(헤일로) + 밝은 심 — 두 겹으로 그려 별가루처럼 보이게
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${tw * .09})`;
      ctx.arc(x, y, p.s * 2.6, 0, TAU);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${tw * .62})`;
      ctx.arc(x, y, p.s, 0, TAU);
      ctx.fill();
    }
  };

  const start = () => { if (!live) { live = true; raf = requestAnimationFrame(draw); } };
  const stop  = () => { live = false; cancelAnimationFrame(raf); };


  addEventListener('resize', resize);
  // 히어로가 화면에서 벗어나면 그리기를 멈춥니다
  new IntersectionObserver(([e]) => e.isIntersecting ? start() : stop()).observe(hero);
  resize();
  addEventListener('load', resize);   // 폰트 로딩 후 위치 보정
}

/* ── 8) 커스텀 커서 ───────────────────────────────────────
   반투명 원이 커서를 대신하고 빛무리가 살짝 뒤따라옵니다.
   position:fixed 라서 페이지 어디로 스크롤해도 계속 따라다닙니다.
   마우스가 없는 순수 터치 기기에서만 켜지지 않습니다.
   ─────────────────────────────────────────────────────── */
const curEl = el('cur');
const usesMouse = matchMedia('(any-hover:hover) and (any-pointer:fine)').matches
               || matchMedia('(hover:hover) and (pointer:fine)').matches;

if (curEl && usesMouse) {
  document.body.classList.add('cur-enabled');
  let tx = 0, ty = 0;          // 실제 커서 위치
  let started = false;

  const loop = () => {
    requestAnimationFrame(loop);
    curEl.style.transform = `translate(${tx}px, ${ty}px)`;
  };

  // 밝은 섹션 위에서는 원 테두리를 어둡게
  const paperBands = [...document.querySelectorAll('.band--paper, .band--paper-alt')];
  const checkPaper = () => {
    const onPaper = paperBands.some(b => {
      const r = b.getBoundingClientRect();
      return r.top <= ty && r.bottom > ty;
    });
    document.body.classList.toggle('cur-paper', onPaper);
  };

  const moveCursor = e => {
    tx = e.clientX; ty = e.clientY;
    if (!started) {                       // 첫 진입 시 시작
      started = true;
      document.body.classList.add('cur-on');
      loop();
    }
    // 링크·버튼 위에서는 링이 커지고 동심원이 생깁니다
    const hot = e.target.closest && e.target.closest('a, button, .work-media, .lightbox-image-stage, .strength');
    document.body.classList.toggle('cur-tap', !!hot);
    checkPaper();
  };

  if ('PointerEvent' in window) {
    addEventListener('pointermove', moveCursor, { passive: true });
  } else {
    addEventListener('mousemove', moveCursor, { passive: true });
  }

  addEventListener('scroll', checkPaper, { passive: true });

  // 누를 때: 링 축소 + 빛살 한 번 터뜨리기
  addEventListener('pointerdown', () => {
    document.body.classList.add('cur-down');
    document.body.classList.remove('cur-burst');
    void curEl.offsetWidth;               // 같은 애니메이션을 다시 재생시키기 위한 리플로우
    document.body.classList.add('cur-burst');
  });
  addEventListener('pointerup',     () => document.body.classList.remove('cur-down'));
  addEventListener('pointercancel', () => document.body.classList.remove('cur-down'));

  // 창 밖으로 나가면 숨김
  addEventListener('pointerleave', () => document.body.classList.remove('cur-on'));
  addEventListener('pointerenter', () => started && document.body.classList.add('cur-on'));
}
</script>
</body>
</html>
