  :root{
    --navy:#051C2C;
    --navy-soft:#0A2A40;
    --blue:#0066B1;
    --cyan:#00A9E0;
    --platinum:#E4E4E6;
    --steel:#8D99AE;
    --bg:#F9FAFB;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    font-family:'Pretendard','Pretendard Variable','Inter',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Segoe UI',sans-serif;
    background:var(--bg);
    color:var(--navy);
    font-size:18px;
    line-height:1.75;
    letter-spacing:-0.011em;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  ::selection{ background:#00A9E0; color:#051C2C; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:#EDEFF2; }
  ::-webkit-scrollbar-thumb{ background:#C2C9D3; border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--blue); }

  .sec-offset{ scroll-margin-top:88px; }

  .glass{
    background:rgba(249,250,251,0.70);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
  }
  .glass-dark{
    background:rgba(5,28,44,0.55);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
  }

  .hairline{ border:1px solid rgba(141,153,174,0.20); }
  .hairline-dark{ border:1px solid rgba(255,255,255,0.10); }

  .grad-text{
    background:linear-gradient(96deg,#FFFFFF 0%,#BFE7FA 42%,#00A9E0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .grad-text-dark{
    background:linear-gradient(96deg,#051C2C 0%,#0066B1 60%,#00A9E0 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .lift{ transition:transform .45s cubic-bezier(.22,1,.36,1), box-shadow .45s cubic-bezier(.22,1,.36,1), border-color .45s ease; }
  .lift:hover{ transform:translateY(-6px); box-shadow:0 24px 60px -24px rgba(5,28,44,0.28); border-color:rgba(0,102,177,0.35); }
  .lift-dark:hover{ transform:translateY(-6px); box-shadow:0 24px 60px -20px rgba(0,169,224,0.30); border-color:rgba(0,169,224,0.40); }

  .edge-line{ position:relative; overflow:hidden; }
  .edge-line::after{
    content:""; position:absolute; left:0; bottom:0; height:2px; width:0;
    background:linear-gradient(90deg,#0066B1,#00A9E0); transition:width .55s cubic-bezier(.22,1,.36,1);
  }
  .edge-line:hover::after{ width:100%; }

  @keyframes glowPulse{
    0%,100%{ box-shadow:0 0 22px -4px rgba(0,169,224,.55); }
    50%{ box-shadow:0 0 42px 2px rgba(0,169,224,.75); }
  }
  .glow{ animation:glowPulse 3.4s ease-in-out infinite; }

  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }
  .floaty{ animation:floatY 6s ease-in-out infinite; }

  @keyframes scanline{ 0%{ transform:translateY(-100%);} 100%{ transform:translateY(400%);} }
  .scanline{ animation:scanline 7s linear infinite; }

  @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
  .fade-in{ animation:fadeIn .3s ease both; }
  @keyframes popIn{ from{opacity:0; transform:translateY(18px) scale(.985)} to{opacity:1; transform:translateY(0) scale(1)} }
  .pop-in{ animation:popIn .38s cubic-bezier(.22,1,.36,1) both; }

  .tabular{ font-variant-numeric:tabular-nums; }
  .track-wide{ letter-spacing:.22em; }

  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  .modal-body::-webkit-scrollbar{ width:5px; }
  .modal-body::-webkit-scrollbar-thumb{ background:#C2C9D3; border-radius:99px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition-duration:.01ms !important; }
    html{ scroll-behavior:auto; }
  }
</style>

    if (el) {
      el.innerHTML =
        '<div style="max-width:720px;margin:80px auto;padding:0 24px;font-family:system-ui,sans-serif">' +
        '<h1 style="font-size:34px;font-weight:800;color:#051C2C;margin:0 0 12px">페이지를 표시할 수 없습니다</h1>' +
        '<p style="font-size:16px;color:#57646F;line-height:1.8">아래 오류를 알려주시면 바로 수정하겠습니다.</p>' +
        '<pre style="margin-top:16px;padding:16px;background:#F4F6F8;border-radius:12px;font-size:13px;color:#B3261E;white-space:pre-wrap">' +
        (err && (err.stack || err.message) ? String(err.stack || err.message) : String(err)) + '</pre></div>';
    }
    if (window.console && console.error) console.error(err);
  }
})();
</script>
</body>
</html>
